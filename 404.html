<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 — Page Not Found | Alphastic</title>

  <meta name="description" content="Oops! This page doesn't exist on Alphastic.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #050507;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .orb {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
    }

    .orb.one {
      background: #6c4cff;
      top: -180px;
      left: -120px;
    }

    .orb.two {
      background: #345cff;
      right: -180px;
      bottom: -180px;
      animation-delay: -4s;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 55px 55px;
      mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(40px, -30px) scale(1.08);
      }
    }

    .container {
      position: relative;
      z-index: 2;
      width: 92%;
      max-width: 850px;
      text-align: center;
      padding: 40px 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 35px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #725cff;
      box-shadow: 0 0 25px #725cff;
    }

    .error {
      font-size: clamp(120px, 25vw, 260px);
      line-height: .8;
      font-weight: 900;
      letter-spacing: -18px;
      background: linear-gradient(
        135deg,
        #ffffff 10%,
        #a69aff 45%,
        #5744ff 90%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 80px rgba(105, 82, 255, .18);
      margin-right: 18px;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 100px;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(15px);
      color: #aaa;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 45px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(32px, 6vw, 64px);
      line-height: 1;
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    h1 span {
      color: #7564ff;
    }

    p {
      max-width: 560px;
      margin: auto;
      color: #8d8d96;
      font-size: 16px;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      color: #fff;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      transition: .3s ease;
    }

    .primary {
      background: #fff;
      color: #050507;
      box-shadow: 0 10px 40px rgba(255,255,255,.12);
    }

    .primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 50px rgba(255,255,255,.2);
    }

    .secondary {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(15px);
    }

    .secondary:hover {
      background: rgba(255,255,255,.09);
      transform: translateY(-3px);
    }

    .footer {
      margin-top: 55px;
      color: #55555e;
      font-size: 12px;
      letter-spacing: .5px;
    }

    @media (max-width: 600px) {
      .error {
        letter-spacing: -8px;
      }

      h1 {
        letter-spacing: -2px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="grid"></div>
  </div>

  <main class="container">

    <div class="brand">
      <div class="brand-dot"></div>
      ALPHASTIC
    </div>

    <div class="error">404</div>

    <div class="badge">
      Lost in the edit?
    </div>

    <h1>
      This page went<br>
      <span>off the timeline.</span>
    </h1>

    <p>
      Looks like this page doesn't exist anymore —
      or maybe it was never rendered. Let's get you
      back to the good stuff.
    </p>

    <div class="buttons">

      <a href="/" class="btn primary">
        ← Back to Alphastic
      </a>

      <a href="javascript:history.back()" class="btn secondary">
        Go Back
      </a>

    </div>

    <div class="footer">
      © 2026 Alphastic — Create. Edit. Stand Out.
    </div>

  </main>

</body>
</html>
